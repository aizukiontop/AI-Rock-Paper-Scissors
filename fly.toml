app = "ai-rock-paper-scissors"
primary_region = "sin"

[processes]
  app = "gunicorn -w 1 --threads 4 --timeout 60 -b 0.0.0.0:8080 main:app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"